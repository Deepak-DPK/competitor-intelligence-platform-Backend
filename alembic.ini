# Alembic migration environment configuration
# ------------------------------------------
# Generated by `alembic init alembic` and customised for SQLAlchemy 2
# async + Supabase PostgreSQL.
#
# See: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this ini file)
script_location = alembic

# Template for new migration file names: YYYY-MM-DD-HHMM_short_description
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone used for %%(year)d etc. tokens above
timezone = UTC

# Max length of slug in migration filename
truncate_slug_length = 40

# Log configuration is handled programmatically via app/core/logging.py
# so we leave this section empty.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
